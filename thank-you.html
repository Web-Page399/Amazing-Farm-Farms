<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | AMAZING Farms</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .thank-you {
            background: white;
            padding: 50px 30px;
            max-width: 550px;
            width: 90%;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .check {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            color: #198754;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
        }

        .home-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background: #198754;
            color: white;
            text-decoration: none;
            border-radius: 30px;
        }

        .home-btn:hover {
            background: #146c43;
        }
    </style>
</head>

<body>

    <div class="thank-you">
        <div class="check">✓</div>

        <h1>Thank You!</h1>

        <p>
            Your request has been received successfully.
            Our team at AMAZING Farms will review your enquiry
            and get back to you shortly.
        </p>

        <a href="index.html" class="home-btn">
            Back to Home
        </a>
    </div>

</body>
</html>
